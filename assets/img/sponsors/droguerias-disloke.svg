  <g transform="translate(125, 24)">
    <text x="0" y="24" font-family="'Montserrat', 'Inter', sans-serif" font-size="13" font-weight="800" fill="#38BDF8" letter-spacing="3">DROGUERÍAS</text>
    <text x="0" y="60" font-family="'Montserrat', 'Inter', sans-serif" font-size="33" font-weight="900" fill="url(#gradGlowDisloke)" letter-spacing="2.5">DISLOKE</text>
    <text x="0" y="78" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="1.5">PRODUCTOS DE LIMPIEZA · ICOD</text>
