<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradAlu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0052FF"/>
    </linearGradient>
    <linearGradient id="silverGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Frame -->
  <g transform="translate(15, 15)">
    <rect x="0" y="0" width="90" height="90" rx="18" fill="#0B1120" stroke="url(#gradAlu)" stroke-width="4"/>
    <rect x="12" y="12" width="66" height="66" rx="10" fill="rgba(0, 210, 255, 0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- Aluminium window / structure cross -->
    <line x1="45" y1="12" x2="45" y2="78" stroke="url(#gradAlu)" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="45" x2="78" y2="45" stroke="url(#gradAlu)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="45" cy="45" r="7" fill="#00D2FF"/>
  </g>
  
  <!-- Typography -->
  <g transform="translate(125, 24)">
    <text x="0" y="24" font-family="'Montserrat', 'Inter', sans-serif" font-size="12.5" font-weight="800" fill="#00D2FF" letter-spacing="3.5">SOLUCIONES EN ALUMINIO</text>
    <text x="0" y="60" font-family="'Montserrat', 'Inter', sans-serif" font-size="33" font-weight="900" fill="url(#silverGlow)" letter-spacing="1.5">GUILLERMO</text>
    <text x="0" y="78" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#64748B" letter-spacing="2">PATROCINADOR PRINCIPAL · ICOD</text>
  </g>
</svg>
