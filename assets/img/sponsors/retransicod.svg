<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradEco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gradMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Icon: Recycle & Metal Gear Frame -->
  <g transform="translate(15, 15)">
    <rect x="0" y="0" width="90" height="90" rx="18" fill="#0B1120" stroke="url(#gradEco)" stroke-width="4"/>
    <rect x="12" y="12" width="66" height="66" rx="10" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- Recycled arrows symbol -->
    <path d="M 45 23 L 56 36 L 49 36 C 49 46 44 54 36 60 L 30 54 C 36 50 40 44 40 36 L 34 36 Z" fill="url(#gradEco)"/>
    <path d="M 68 53 L 62 63 L 62 57 C 54 57 46 61 41 69 L 35 63 C 42 54 52 49 62 49 L 62 43 Z" fill="#34D399"/>
    <circle cx="45" cy="45" r="5" fill="#10B981"/>
  </g>

  <!-- Typography -->
  <g transform="translate(125, 24)">
    <text x="0" y="24" font-family="'Montserrat', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#34D399" letter-spacing="2.5">GESTOR DE RESIDUOS</text>
    <text x="0" y="58" font-family="'Montserrat', 'Inter', sans-serif" font-size="30" font-weight="900" fill="url(#gradMetal)" letter-spacing="2">RETRANSICOD</text>
    <text x="0" y="78" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="1.8">CHATARRAS Y METALES S.L.U.</text>
  </g>
</svg>
